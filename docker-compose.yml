services:
  isl:
    build: .
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      ISL_CONF: "0.70"
      ISL_MARGIN: "0.20"
      ISL_MAX_UPLOAD_BYTES: "209715200"
      ISL_MAX_VIDEO_SECONDS: "180"
      ISL_MAX_CONCURRENT_UPLOADS: "4"
      ISL_MAX_CONCURRENT_DECODES: "2"
      ISL_MAX_CONCURRENT_INFERENCES: "2"
      ISL_UPLOAD_TTL_SECONDS: "3600"
      ISL_JOB_TTL_SECONDS: "604800"
      ISL_MAX_PENDING_JOBS: "10"
      ISL_ENABLE_LOCAL_LEGACY_WS: "false"
    volumes:
      - ./models:/app/models:ro
