[project]
name = "isl-translation-engine"
version = "2.0.0"
description = "Evidence-based Indian Sign Language recognition and translation research prototype"
requires-python = ">=3.11,<3.13"
dependencies = [
  "datasets>=2.19,<4",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
  "mediapipe==0.10.14",
  "numpy>=1.24,<3",
  "onnx>=1.15,<2",
  "onnxruntime>=1.17,<2",
  "pandas>=2.0,<4",
  "python-multipart>=0.0.9,<1",
  "sacrebleu>=2.4,<3",
  "torch>=2.2,<3",
  "uvicorn[standard]>=0.29,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.optional-dependencies]
experiments = ["scikit-learn>=1.4,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
